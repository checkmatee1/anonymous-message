limit_req_zone $binary_remote_addr zone=message_submit:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=message_login:1m rate=5r/m;

server {
    listen 80;
    server_name message.xjcpp.love;
    root /www/server/stop;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name message.xjcpp.love;
    ssl_certificate /etc/letsencrypt/live/message.xjcpp.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/message.xjcpp.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log off;
    error_log /dev/null crit;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";

    location = /api/questions {
        limit_req zone=message_submit burst=3 nodelay;
        proxy_pass http://127.0.0.1:23002;
    }
    location = /api/admin/login {
        limit_req zone=message_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:23002;
    }
    location / { proxy_pass http://127.0.0.1:23002; }
}
